buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["TruvideoReactTurboVideoSdk_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TruvideoReactTurboVideoSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TruvideoReactTurboVideoSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.truvideoreactturbovideosdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = "17"
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
          java.srcDirs += [
            "generated/java",
            "generated/jni"
          ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

// Force Kotlin stdlib version - allow 2.2.0 for Truvideo SDK compatibility
configurations.all {
  resolutionStrategy {
    // Don't force downgrade - allow SDK to use 2.2.0 if needed
    // but ensure minimum version compatibility
    eachDependency { DependencyResolveDetails details ->
      if (details.requested.group == 'org.jetbrains.kotlin' && 
          details.requested.name.startsWith('kotlin-stdlib')) {
        // Allow 2.2.0 or higher for compatibility with Truvideo SDK
        def requestedVersion = details.requested.version
        if (requestedVersion != null && 
            (requestedVersion.startsWith('2.2') || requestedVersion.startsWith('2.3') || requestedVersion.startsWith('2.4'))) {
          // Keep the higher version
          details.useVersion(requestedVersion)
        } else {
          // Use at least 2.2.0 for kotlin.time.Clock.System support
          details.useVersion("2.2.0")
        }
      }
    }
  }
}

// Configure Kotlin extension
kotlin {
    jvmToolchain(17)
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  // Use 2.2.0 for kotlin.time.Clock.System support required by Truvideo SDK
  api "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
  api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0"
  implementation "com.github.Truvideo:truvideo-sdk-android-video:79.1.4"
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.google.android.material:material:1.12.0'

  implementation 'androidx.activity:activity:1.9.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  
  // Kodein DI dependency required by Truvideo SDK
  implementation 'org.kodein.di:kodein-di:7.30.0'
  implementation 'org.kodein.di:kodein-di-framework-android-x:7.30.0'
  
  // Multiplatform Settings dependency required by Truvideo SDK
  implementation 'com.russhwolf:multiplatform-settings-android:1.3.0'
  
  // Core Library Desugaring for java.time APIs on Android < 26
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "TruvideoReactTurboVideoSdk"
    codegenJavaPackageName = "com.truvideoreactturbovideosdk"
  }
}
